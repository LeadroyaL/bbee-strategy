 if(summons.length>1)addButtons(controls,'召唤策略',summons.map(g=>[g.id,g.base[4]]),c.g.id,id=>choose(active,f.choices.findIndex(x=>x.g.id===id)));
 const peers=f.choices.map((x,i)=>({x,i})).filter(({x})=>x.g.id===c.g.id).sort((a,b)=>{const priority=x=>x.t.columns.some(col=>col.origin==='I'&&col.ids.some(id=>S[id].name==='冰锥极寒'))?0:1;return priority(a.x)-priority(b.x)||b.x.t.columns.filter(col=>col.origin==='I').length-a.x.t.columns.filter(col=>col.origin==='I').length});
 if(peers.length>1){const common=c.t.columns.filter(col=>col.origin==='I'&&peers.every(({x})=>x.t.columns.some(other=>other.origin==='I'&&JSON.stringify(other.ids)===JSON.stringify(col.ids))));const fixed=common.flatMap(col=>col.ids);if(common.length)controls.append(el('p','fixed-inheritance','固定传承（'+common.length+'个）：'+common.map(col=>col.ids.length>1?'（'+col.ids.map(i=>S[i].name).join('／')+(col.ids.length===2?'，二选一）':'，任选一个）'):S[col.ids[0]].name).join('、')));
 addButtons(controls,common.length===3?'第四个传承策略':'传承配置',peers.map(({x,i})=>{const extra=x.t.columns.filter(col=>col.origin==='I'&&!col.ids.every(id=>fixed.includes(id)));return [i,extra.length?extra.map(col=>col.ids.map(id=>S[id].name).join(' / ')).join('、'):'不使用第四个传承位']}),choice,i=>choose(active,Number(i),null,true));}
 if(controls.children.length)page.append(controls);
 const lookup={};cols.forEach((col,i)=>col.ids.forEach(id=>lookup[id]=selected[i]));const name=id=>S[lookup[id]??id].name;
 const legend=el('p','table-legend');legend.append(el('span','inherited','红字：传承带入'),el('span','normal-red','橙字：局内获取'),el('span','black-market','蓝字：黑市获取'));page.append(legend);
 const wrap=el('div','route-scroll'),table=el('table','route-table'),head=el('tr');const colgroup=el('colgroup');for(const width of [5,4,8,8,8,11,11,11,9,8,9,8]){const col=el('col');col.style.width=width+'%';colgroup.append(col)}table.append(colgroup);
 for(const title of ['流派','技能位','1级','2级','3级'])head.append(el('th','',title));
 const dual=el('th','','双重策略');dual.colSpan=3;head.append(dual);
 for(const title of ['传承角色A','传承角色B']){const th=el('th','',title);th.colSpan=2;head.append(th)}table.append(head);
 const inherited=cols.map((col,i)=>({col,i})).filter(x=>x.col.origin==='I').sort((a,b)=>a.col.slot-b.col.slot||a.col.label-b.col.label);
 const carrierKey=inherited.map(x=>selected[x.i]).sort((a,b)=>a-b).join(',');const plans=DATA.carriers[carrierKey].slice().sort((a,b)=>Math.min(...a.reds.map(id=>cols.find(col=>col.ids.includes(id)).slot))-Math.min(...b.reds.map(id=>cols.find(col=>col.ids.includes(id)).slot)));if(plans.length!==2)throw Error('Missing carrier plan');
 for(let slot=0;slot<5;slot++){
  const row=el('tr');if(slot===0){const cell=el('td','family-name',titles[active]);cell.rowSpan=5;row.append(cell)}
  row.append(el('td','slot-name',slots[slot]),el('td','',c.g.base[slot]));
  for(const tier of [2,3]){const up=r.trace.filter(st=>S[st.id].faction===S[c.g.baseIds[slot]].faction&&S[st.id].gradation===tier);const cell=el('td');if(up.length)up.forEach(st=>cell.append(el('div','',st.name)));else cell.append(document.createTextNode('—'));row.append(cell)}
  const entries=cols.map((col,i)=>({col,i})).filter(x=>x.col.slot===slot).sort((a,b)=>a.col.origin.localeCompare(b.col.origin)||a.col.label-b.col.label);
  for(let j=0;j<3;j++){const cell=el('td','red-cell');if(entries[j]){const {col,i}=entries[j];cell.className+=' '+(col.origin==='I'?'inherited':'normal-red');if(col.ids.length>1)addButtons(cell,'',col.ids.map(id=>[id,S[id].name]),selected[i],id=>{selected[i]=Number(id);render()});else {const strong=el('strong');strong.append(ruleLink(selected[i]));cell.append(strong)}}row.append(cell)}
  for(const plan of plans){const base=plan.bases[slot];row.append(el('td','carry-base',base?S[base].name:'—'));const carryCell=el('td','inherited');for(const id of plan.reds.filter(id=>base&&S[base].labels.includes(S[id].truePre[0]))){const item=el('div','carry-red'+(plan.black.includes(id)?' black-market':''));item.append(ruleLink(id));carryCell.append(item)}row.append(carryCell)}
  table.append(row);
 }
 const noteRow=el('tr');noteRow.append(el('td','','备注'));const note=el('td','route-notes');note.colSpan=11;
 const delayed=new Map();for(const inheritedId of r.inheritIds){const normal=r.normalIds.find(id=>S[id].truePre[0]===S[inheritedId].truePre[0]);if(!normal)continue;const at=r.trace.find(t=>t.newlyActiveReds.includes(S[inheritedId].name));if(!delayed.has(at.id))delayed.set(at.id,{normal:[],inherited:[]});delayed.get(at.id).normal.push(normal);delayed.get(at.id).inherited.push(inheritedId)}
 const order=el('ol','acquisition-order');
 const addNote=(parent,label,text)=>{const item=el(parent===order?'li':'p',parent===order?'':'restriction');item.append(el('strong','',label+'：'),document.createTextNode(text));parent.append(item)};
 if(c.g.expert)addNote(note,'模式要求','需要突变：策略扩容。按以下顺序获取同一流派的两个II阶策略。');
 for(const [id,items] of delayed)addNote(note,'获取限制','获取'+items.normal.map(name).join('、')+'之前，不得获取'+name(id)+'，避免提前激活'+items.inherited.map(name).join('、')+'并触发互斥。');
 let pending=[],kind=null;
 const flush=()=>{if(!pending.length)return;addNote(order,kind==='normal'?'局内获取':'前置策略','依次获取'+pending.join(' → ')+'。');pending=[]};
 for(const step of r.trace){
  if(delayed.has(step.id)){flush();const items=delayed.get(step.id);addNote(order,'传承激活','获取'+name(step.id)+'，激活继承的'+items.inherited.map(name).join('、')+'。');kind=null;continue}
  const next=S[step.id].gradation===4?'normal':'ordinary';if(kind!==next)flush();kind=next;pending.push(name(step.id));
 }flush();note.append(order);
 for(let pi=0;pi<plans.length;pi++){
  const plan=plans[pi];if(!plan.black.length)continue;
  const block=el('div','carrier-recipe');block.append(el('strong','','工具人'+['A','B'][pi]+'制作'));
  const steps=el('ol','acquisition-order');let ids=[],source=null;
  const flushCarrier=()=>{if(!ids.length)return;const item=el('li');const label=source===5?'黑市获取':S[ids[0]].gradation===4?'局内获取':'前置策略';item.append(el('strong','',label+'：'),document.createTextNode('依次获取'+ids.map(id=>S[id].name).join(' → ')+'。'));steps.append(item);ids=[]};
  for(const step of plan.steps){const next=step.source===5?5:S[step.id].gradation===4?4:1;if(next!==source)flushCarrier();source=next;ids.push(step.id)}flushCarrier();block.append(steps);
  addNote(block,'获取限制','完成上述前置后，对应策略进入黑市候选池；刷新不保证出现。');note.append(block);
 }
 noteRow.append(note);table.append(noteRow);wrap.append(table);page.append(wrap);
 const detail=el('details');detail.append(el('summary','','完整拿取顺序 · '+r.trace.length+'步'));const steps=el('ol','steps');for(const st of r.trace){const li=el('li','',name(st.id));if(st.newlyActiveReds.length)li.append(el('small','','激活：'+st.newlyActiveReds.map(n=>{const id=Object.keys(S).find(id=>S[id].name===n);return name(Number(id))}).join('、')));steps.append(li)}detail.append(steps);page.append(detail);
 const exact=c.t.routes.find(raw=>[...raw.inheritIds,...raw.normalIds].every(id=>Object.values(selected).includes(id)));if(!exact)throw Error('Invalid alternative combination');const foot=el('p','muted foot');const link=el('a','','当前组合 '+exact.routeId);link.href='#'+exact.routeId;foot.append(link,document.createTextNode(' · '+r.inheritIds.length+'个传承红＋'+r.normalIds.length+'个局内红＝8红'));page.append(foot);
}
const buttons=families.map((f,i)=>{const b=el('button','family');b.append(el('strong','',String(i+1).padStart(2,'0')+'　'+titles[i]));if(f.groups[0].expert)b.append(el('small','','需要突变：策略扩容'));b.addEventListener('click',()=>choose(i));document.getElementById('families').append(b);return b});
function jump(){const key=location.hash.slice(1);for(let fi=0;fi<families.length;fi++){const f=families[fi];for(let ci=0;ci<f.choices.length;ci++){const c=f.choices[ci],r=c.t.routes.find(r=>r.routeId===key);if(r||key===f.id||key===c.g.id){choose(fi,ci,r?[...r.inheritIds,...r.normalIds]:null);return}}}}
window.addEventListener('hashchange',jump);choose(0);jump();
